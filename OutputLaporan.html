<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Output Laporan</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: 'Segoe UI', sans-serif;
}

.wrapper {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

.title {
  text-align: center;
  font-size: 24px;
  color: #38bdf8;
  margin-bottom: 20px;
}

/* CARD */
.card {
  background: #1e4f6f;
  border-radius: 20px;
  padding: 20px;
  border: 4px solid #e5e7eb;
}

/* ROW */
.row {
  display: flex;
  align-items: center;
  margin-bottom: 20px;
}

/* ICON */
.logo {
  width: 40px;
  margin-right: 15px;
}

/* LINE */
.divider {
  width: 2px;
  height: 70px;
  background: white;
  margin-right: 15px;
}

/* TEXT */
.data {
  line-height: 1.6;
}

/* GROWTH */
.up { color: #22c55e; }
.down { color: #ef4444; }

</style>
</head>

<body>

<div class="wrapper">

<div class="title">📊 Social Media Counts</div>

<div id="output" class="card"></div>

</div>

<script>

// FORMAT
function format(n){
  if (!n) return "-";
  n = Number(n);
  if (n >= 1000) return (n/1000).toFixed(1)+"K";
  return n;
}

// GROWTH
function growth(cur, prev){
  if (!prev) return "";
  let diff = cur - prev;
  if (diff > 0) return `<span class="up">(+${format(diff)})</span>`;
  if (diff < 0) return `<span class="down">(${format(diff)})</span>`;
  return "";
}

// LOAD DATA
const data = JSON.parse(localStorage.getItem("laporan_bulanan")) || {};
const prev = JSON.parse(localStorage.getItem("laporan_prev")) || null;

// BUILDER
function row(icon, content){
  return `
  <div class="row">
    <img src="${icon}" class="logo">
    <div class="divider"></div>
    <div class="data">${content}</div>
  </div>`;
}

let html = "";

// X
html += row(
  "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg",
  `
  FOLLOWING: ${data.x?.following || "-"}<br>
  FOLLOWERS: ${format(data.x?.followers)} ${growth(data.x?.followers, prev?.x?.followers)}<br>
  POSTS: ${data.x?.posts || "-"}
  `
);

// THREADS
html += row(
  "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/threads.svg",
  `
  FOLLOWING: ${data.threads?.following || "-"}<br>
  FOLLOWERS: ${format(data.threads?.followers)} ${growth(data.threads?.followers, prev?.threads?.followers)}<br>
  POSTS: ${data.threads?.posts || "-"}
  `
);

// INSTAGRAM
html += row(
  "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg",
  `
  FOLLOWING: ${data.instagram?.following || "-"}<br>
  FOLLOWERS: ${format(data.instagram?.followers)} ${growth(data.instagram?.followers, prev?.instagram?.followers)}<br>
  POSTS: ${data.instagram?.posts || "-"}<br>
  STORIES: ${data.instagram?.stories || "-"}
  `
);

// TIKTOK
html += row(
  "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg",
  `
  FOLLOWING: ${data.tiktok?.following || "-"}<br>
  FOLLOWERS: ${format(data.tiktok?.followers)} ${growth(data.tiktok?.followers, prev?.tiktok?.followers)}<br>
  POSTS: ${data.tiktok?.posts || "-"}<br>
  STORIES: ${data.tiktok?.stories || "-"}
  `
);

// PM
html += row(
  "https://cdn-icons-png.flaticon.com/512/3135/3135715.png",
  `
  TEXTS: ${data.pm?.texts || "-"} ${growth(data.pm?.texts, prev?.pm?.texts)}<br>
  AUDIOS: ${data.pm?.audios || "-"} ${growth(data.pm?.audios, prev?.pm?.audios)}<br>
  IMAGES: ${data.pm?.images || "-"} ${growth(data.pm?.images, prev?.pm?.images)}
  `
);

document.getElementById("output").innerHTML = html;

</script>

</body>
</html>
