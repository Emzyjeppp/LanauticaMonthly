<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Output Laporan Bulanan - Lanautica</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16, #111827, #1e293b);
      --card-bg: rgba(30, 41, 59, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --accent-blue: #38bdf8;
      --accent-blue-hover: #0ea5e9;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-purple: #a78bfa;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', 'Segoe UI', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    .header-nav {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding: 0 10px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s ease;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
    }

    .back-btn:hover {
      color: var(--accent-purple);
      border-color: rgba(167, 139, 250, 0.3);
      background: rgba(167, 139, 250, 0.05);
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-purple);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* ACTION BAR */
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.4);
      padding: 15px 20px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }

    .action-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-edit { background: var(--accent-blue); color: #090d16; }
    .btn-edit:hover { background: var(--accent-blue-hover); }

    .btn-copy { background: var(--accent-purple); color: white; }
    .btn-copy:hover { background: #8b5cf6; }

    .btn-utility { background: rgba(255, 255, 255, 0.06); color: var(--text-main); border: 1px solid var(--card-border); }
    .btn-utility:hover { background: rgba(255, 255, 255, 0.12); }

    /* DASHBOARD LAYOUT */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 25px;
    }

    .dashboard-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--accent-blue);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title.yellow { color: var(--accent-amber); }
    .card-title.purple { color: var(--accent-purple); }

    /* PLATFORM GRID ROW */
    .platform-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .platform-row:last-child {
      margin-bottom: 0;
    }

    @media (max-width: 700px) {
      .platform-row {
        grid-template-columns: 1fr;
      }
    }

    .platform-item {
      background: rgba(15, 23, 42, 0.45);
      border-radius: 14px;
      padding: 16px 20px;
      border: 1px solid rgba(255, 255, 255, 0.02);
      display: flex;
      align-items: flex-start;
      gap: 15px;
      transition: border-color 0.2s;
    }

    .platform-item:hover {
      border-color: rgba(255,255,255,0.06);
    }

    .logo-box {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .logo-img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .divider-line {
      width: 1.5px;
      height: auto;
      align-self: stretch;
      background: rgba(255, 255, 255, 0.08);
    }

    .stats-info {
      flex-grow: 1;
      font-size: 13px;
      line-height: 1.6;
    }

    .platform-name {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 5px;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
    }

    /* GROWTH STYLING */
    .growth-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      display: inline-flex;
      align-items: center;
    }

    .growth-up {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
    }

    .growth-down {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state span {
      font-size: 40px;
      display: block;
      margin-bottom: 15px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #10b981;
      color: white;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    select {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    select:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.2);
    }
    .select-group {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="header-nav">
    <a href="index.html" class="back-btn">
      ← Hub Utama
    </a>
    <button class="back-btn" onclick="openSettingsModal()" style="border-color: rgba(167, 139, 250, 0.2); color: var(--accent-purple);">
      ⚙️ Setup Cloud
    </button>
    <div class="page-title" style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
      <span style="font-size: 20px;">📊 Output Laporan</span>
      <div class="select-group">
        <select id="laporan_bulan" onchange="changeMonthYear()">
          <option value="0">Januari</option>
          <option value="1">Februari</option>
          <option value="2">Maret</option>
          <option value="3">April</option>
          <option value="4">Mei</option>
          <option value="5">Juni</option>
          <option value="6">Juli</option>
          <option value="7">Agustus</option>
          <option value="8">September</option>
          <option value="9">Oktober</option>
          <option value="10">November</option>
          <option value="11">Desember</option>
        </select>
        <select id="laporan_tahun" onchange="changeMonthYear()">
          <option value="2025">2025</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
          <option value="2029">2029</option>
          <option value="2030">2030</option>
        </select>
      </div>
    </div>
  </div>

  <div class="container">
    
    <!-- ACTION BAR -->
    <div class="action-bar">
      <div class="action-group">
        <button class="btn btn-edit" onclick="window.location.href='InputLaporan.html'">
          ✏️ Edit Laporan
        </button>
        <button class="btn btn-copy" onclick="copyReportText()">
          📋 Copy Format Chat
        </button>
      </div>

      <div class="action-group">
        <button class="btn btn-utility" style="background: var(--accent-red); color: white; border-color: rgba(239, 68, 68, 0.4);" onclick="deleteReport()">
          🗑️ Hapus Laporan
        </button>
        <button class="btn btn-utility" onclick="exportJSON()">
          💾 Backup JSON
        </button>
        <button class="btn btn-utility" onclick="triggerImport()">
          📂 Restore JSON
        </button>
      </div>
    </div>

    <!-- MAIN DASHBOARD CONTENT -->
    <div class="container" id="dashboardContent">
      <!-- Generated dynamically in JS -->
    </div>

  </div>

  <input type="file" id="jsonUploadInput" accept=".json" onchange="importJSON(event)">

  <div class="toast" id="toastMessage">Laporan disalin ke clipboard!</div>

  <script>
    const monthNames = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "Novemb  <!-- SETTINGS MODAL -->
  <div id="settingsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
    <div class="section-card" style="width: 90%; max-width: 500px; position: relative;">
      <h2 style="color: var(--accent-purple); margin-bottom: 20px; text-align: left; display: flex; justify-content: space-between; align-items: center;">
        <span>⚙️ Setup Supabase Cloud</span>
        <span onclick="closeSettingsModal()" style="cursor: pointer; font-size: 20px;">&times;</span>
      </h2>
      <div class="control-group" style="margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px;">
        <label for="cfg_url" style="font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;">Supabase Project URL</label>
        <input id="cfg_url" type="text" placeholder="https://xyz.supabase.co" style="width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 14px; color: var(--text-main); font-size: 14px; outline: none;">
      </div>
      <div class="control-group" style="margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px;">
        <label for="cfg_key" style="font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;">Supabase Anon API Key</label>
        <input id="cfg_key" type="text" placeholder="eyJhbGciOi..." style="width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 14px; color: var(--text-main); font-size: 14px; outline: none;">
      </div>
      <div class="control-group" style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px;">
        <label for="cfg_pin" style="font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;">Admin PIN (untuk Modifikasi)</label>
        <input id="cfg_pin" type="text" placeholder="1234" style="width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 14px; color: var(--text-main); font-size: 14px; outline: none;">
      </div>
      <button class="btn btn-copy" onclick="saveSettings()" style="width: 100%; justify-content: center; padding: 14px; border-radius: 12px;">Simpan Konfigurasi</button>
    </div>
  </div>

  <script>
    // HARDCODED CONFIG (Opsional - Bisa diisi di sini agar tidak perlu setup manual di browser)
    const SUPABASE_HARDCODED = {
      url: "https://jacwvnynsbqeiiekzeu.supabase.co",
      key: "sb_publishable_e9BtfYPFdJ6RGRnsNToQJg_VGyNtYVZ",
      admin_pin: ""
    };

    // Get active configuration
    function getSupabaseConfig() {
      return {
        url: SUPABASE_HARDCODED.url || localStorage.getItem("supabase_url") || "",
        key: SUPABASE_HARDCODED.key || localStorage.getItem("supabase_key") || "",
        admin_pin: SUPABASE_HARDCODED.admin_pin || localStorage.getItem("laporan_admin_pin") || "1234"
      };
    }

    // Settings Modal
    function openSettingsModal() {
      const config = getSupabaseConfig();
      document.getElementById("cfg_url").value = config.url;
      document.getElementById("cfg_key").value = config.key;
      document.getElementById("cfg_pin").value = config.admin_pin;
      document.getElementById("settingsModal").style.display = "flex";
    }

    function closeSettingsModal() {
      document.getElementById("settingsModal").style.display = "none";
    }

    function saveSettings() {
      const url = document.getElementById("cfg_url").value.trim();
      const key = document.getElementById("cfg_key").value.trim();
      const pin = document.getElementById("cfg_pin").value.trim();

      if (url && !url.startsWith("http")) {
        alert("URL harus diawali dengan http:// atau https://");
        return;
      }

      localStorage.setItem("supabase_url", url);
      localStorage.setItem("supabase_key", key);
      localStorage.setItem("laporan_admin_pin", pin);
      
      closeSettingsModal();
      alert("Konfigurasi disimpan! Memuat ulang data...");
      window.location.reload();
    }

    const monthNames = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];

    // Numbers Formatter
    function format(n) {
      if (n === undefined || n === null || n === "") return "-";
      n = Number(n);
      if (isNaN(n)) return "-";
      if (n >= 1000000) return (n/1000000).toFixed(1) + "M";
      if (n >= 1000) return (n/1000).toFixed(1) + "K";
      return n;
    }

    // Growth calculator tag generator
    function growth(cur, prevVal) {
      if (prevVal === undefined || prevVal === null || prevVal === "") return "";
      
      const currentNum = Number(cur);
      const prevNum = Number(prevVal);
      if (isNaN(currentNum) || isNaN(prevNum)) return "";

      const diff = currentNum - prevNum;
      if (diff > 0) {
        return `<span class="growth-tag growth-up">↑ +${format(diff)}</span>`;
      } else if (diff < 0) {
        return `<span class="growth-tag growth-down">↓ ${format(diff)}</span>`;
      }
      return "";
    }

    // Global variables for active selection
    let currentMonth = null;
    let currentYear = null;
    let data = {};
    let prev = null;

    // Render Dashboard
    window.addEventListener("DOMContentLoaded", () => {
      // Default to current date if not set in localStorage
      const now = new Date();
      let defaultMonth = now.getMonth();
      let defaultYear = now.getFullYear();

      // Check if there is an active navigation state
      const savedMonth = localStorage.getItem("selected_laporan_month");
      const savedYear = localStorage.getItem("selected_laporan_year");

      if (savedMonth !== null && savedYear !== null) {
        defaultMonth = parseInt(savedMonth);
        defaultYear = parseInt(savedYear);
      }

      document.getElementById("laporan_bulan").value = defaultMonth;
      document.getElementById("laporan_tahun").value = defaultYear;

      currentMonth = defaultMonth;
      currentYear = defaultYear;

      const config = getSupabaseConfig();
      if (!config.url || !config.key) {
        setTimeout(() => {
          alert("Silakan atur koneksi database Supabase terlebih dahulu.");
          openSettingsModal();
        }, 300);
      } else {
        loadAndRender();
      }
    });

    function changeMonthYear() {
      currentMonth = parseInt(document.getElementById("laporan_bulan").value);
      currentYear = parseInt(document.getElementById("laporan_tahun").value);

      localStorage.setItem("selected_laporan_month", currentMonth);
      localStorage.setItem("selected_laporan_year", currentYear);

      loadAndRender();
    }

    // Fetch single record
    async function fetchRecord(year, month) {
      const config = getSupabaseConfig();
      if (!config.url || !config.key) return null;

      try {
        const res = await fetch(`${config.url}/rest/v1/laporan?select=data&tahun=eq.${year}&bulan=eq.${month}&is_draft=eq.false`, {
          headers: {
            "apikey": config.key,
            "Authorization": `Bearer ${config.key}`
          }
        });
        if (!res.ok) return null;
        const json = await res.json();
        return json.length > 0 ? json[0].data : null;
      } catch (e) {
        console.error("Supabase fetch single error:", e);
        return null;
      }
    }

    async function loadAndRender() {
      const container = document.getElementById("dashboardContent");
      container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 50px;">Memuat data dari database cloud...</div>`;

      data = await fetchRecord(currentYear, currentMonth) || {};

      // Determine previous month automatically
      let prevMonth = currentMonth === 0 ? 11 : currentMonth - 1;
      let prevYear = currentMonth === 0 ? currentYear - 1 : currentYear;
      prev = await fetchRecord(prevYear, prevMonth);

      renderDashboard();
    }

    function renderDashboard() {
      const container = document.getElementById("dashboardContent");

      // Check if data is empty (no fields have values)
      let hasData = false;
      for (let sec in data) {
        for (let field in data[sec]) {
          if (data[sec][field] !== undefined && data[sec][field] !== null && data[sec][field] !== "") {
            hasData = true;
            break;
          }
        }
      }

      if (!hasData) {
        container.innerHTML = `
          <div class="card empty-state">
            <span>📭</span>
            <h2>Laporan ${monthNames[currentMonth]} ${currentYear} Kosong</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Belum ada data laporan diterbitkan untuk bulan ini di cloud database.</p>
            <button class="btn btn-edit" style="display:inline-flex;" onclick="window.location.href='InputLaporan.html'">
              Buat Laporan Baru
            </button>
          </div>
        `;
        return;
      }

      let html = "";

      // 1. LIVE STREAM CARD (Showroom, IDN Live)
      html += `
        <div class="dashboard-card">
          <div class="card-title">
            <span>🎥 Live Stream Counts</span>
          </div>
          
          <div class="platform-row">
            <!-- SHOWROOM -->
            <div class="platform-item">
              <div class="logo-box">✨</div>
              <div class="divider-line"></div>
              <div class="stats-info">
                <div class="platform-name">Showroom</div>
                <strong>FOLLOWING:</strong> ${data.showroom?.following || "-"}<br>
                <strong>FOLLOWERS:</strong> ${format(data.showroom?.followers)} ${growth(data.showroom?.followers, prev?.showroom?.followers)}<br>
                <strong>STREAMS:</strong> ${data.showroom?.streams || "-"} ${growth(data.showroom?.streams, prev?.showroom?.streams)}<br>
                <strong>VIEWS:</strong> ${format(data.showroom?.views)} ${growth(data.showroom?.views, prev?.showroom?.views)}<br>
                <strong>COMMENTS:</strong> ${format(data.showroom?.comments)} ${growth(data.showroom?.comments, prev?.showroom?.comments)}
              </div>
            </div>

            <!-- IDN LIVE -->
            <div class="platform-item">
              <div class="logo-box">🔴</div>
              <div class="divider-line"></div>
              <div class="stats-info">
                <div class="platform-name">IDN Live</div>
                <strong>FOLLOWING:</strong> ${data.idn?.following || "-"}<br>
                <strong>FOLLOWERS:</strong> ${format(data.idn?.followers)} ${growth(data.idn?.followers, prev?.idn?.followers)}<br>
                <strong>STREAMS:</strong> ${data.idn?.streams || "-"} ${growth(data.idn?.streams, prev?.idn?.streams)}<br>
                <strong>VIEWS:</strong> ${format(data.idn?.views)} ${growth(data.idn?.views, prev?.idn?.views)}<br>
                <strong>COMMENTS:</strong> ${format(data.idn?.comments)} ${growth(data.idn?.comments, prev?.idn?.comments)}
              </div>
            </div>
          </div>
        </div>
      `;

      // 2. SOCIAL MEDIA CARD
      html += `
        <div class="dashboard-card">
          <div class="card-title yellow">
            <span>📱 Social Media Counts</span>
          </div>

          <div class="platform-row">
            <!-- X -->
            <div class="platform-item">
              <div class="logo-box">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg" class="logo-img" style="filter: invert(1)">
              </div>
              <div class="divider-line"></div>
              <div class="stats-info">
                <div class="platform-name">X (Twitter)</div>
                <strong>FOLLOWING:</strong> ${data.x?.following || "-"}<br>
                <strong>FOLLOWERS:</strong> ${format(data.x?.followers)} ${growth(data.x?.followers, prev?.x?.followers)}<br>
                <strong>POSTS:</strong> ${data.x?.posts || "-"} ${growth(data.x?.posts, prev?.x?.posts)}
              </div>
            </div>

            <!-- THREADS -->
            <div class="platform-item">
              <div class="logo-box">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/threads.svg" class="logo-img" style="filter: invert(1)">
              </div>
              <div class="divider-line"></div>
              <div class="stats-info">
                <div class="platform-name">Threads</div>
                <strong>FOLLOWING:</strong> ${data.threads?.following || "-"}<br>
                <strong>FOLLOWERS:</strong> ${format(data.threads?.followers)} ${growth(data.threads?.followers, prev?.threads?.followers)}<br>
                <strong>POSTS:</strong> ${data.threads?.posts || "-"} ${growth(data.threads?.posts, prev?.threads?.posts)}
              </div>
            </div>
          </div>

          <div class="platform-row">
            <!-- INSTAGRAM -->
            <div class="platform-item">
              <div class="logo-box">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" class="logo-img" style="filter: invert(1)">
              </div>
              <div class="divider-line"></div>
              <div class="stats-info">
                <div class="platform-name">Instagram</div>
                <strong>FOLLOWING:</strong> ${data.instagram?.following || "-"}<br>
                <strong>FOLLOWERS:</strong> ${format(data.instagram?.followers)} ${growth(data.instagram?.followers, prev?.instagram?.followers)}<br>
                <strong>POSTS:</strong> ${data.instagram?.posts || "-"} ${growth(data.instagram?.posts, prev?.instagram?.posts)}<br>
                <strong>STORIES:</strong> ${data.instagram?.stories || "-"} ${growth(data.instagram?.stories, prev?.instagram?.stories)}
              </div>
            </div>

            <!-- TIKTOK -->
            <div class="platform-item">
              <div class="logo-box">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg" class="logo-img" style="filter: invert(1)">
              </div>
              <div class="divider-line"></div>
              <div class="stats-info">
                <div class="platform-name">TikTok</div>
                <strong>FOLLOWING:</strong> ${data.tiktok?.following || "-"}<br>
                <strong>FOLLOWERS:</strong> ${format(data.tiktok?.followers)} ${growth(data.tiktok?.followers, prev?.tiktok?.followers)}<br>
                <strong>POSTS:</strong> ${data.tiktok?.posts || "-"} ${growth(data.tiktok?.posts, prev?.tiktok?.posts)}<br>
                <strong>STORIES:</strong> ${data.tiktok?.stories || "-"} ${growth(data.tiktok?.stories, prev?.tiktok?.stories)}
              </div>
            </div>
          </div>
        </div>
      `;

      // 3. PRIVATE MESSAGE CARD
      html += `
        <div class="dashboard-card">
          <div class="card-title purple">
            <span>💬 PM (Fanbase)</span>
          </div>

          <div class="platform-row" style="grid-template-columns: 1fr;">
            <div class="platform-item">
              <div class="logo-box">💌</div>
              <div class="divider-line"></div>
              <div class="stats-info" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                <div>
                  <strong>TEXTS:</strong><br>
                  ${data.pm?.texts || "-"} ${growth(data.pm?.texts, prev?.pm?.texts)}
                </div>
                <div>
                  <strong>AUDIOS:</strong><br>
                  ${data.pm?.audios || "-"} ${growth(data.pm?.audios, prev?.pm?.audios)}
                </div>
                <div>
                  <strong>IMAGES:</strong><br>
                  ${data.pm?.images || "-"} ${growth(data.pm?.images, prev?.pm?.images)}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    // Delete Current Month's Report on Supabase
    async function deleteReport() {
      const config = getSupabaseConfig();
      if (!config.url || !config.key) return;

      const pin = prompt("Masukkan PIN Admin untuk menghapus laporan ini:");
      if (pin === null) return;
      if (pin !== config.admin_pin) {
        alert("PIN salah! Akses ditolak.");
        return;
      }

      if (confirm(`Apakah Anda yakin ingin menghapus laporan ${monthNames[currentMonth]} ${currentYear} dari database cloud?`)) {
        try {
          const res = await fetch(`${config.url}/rest/v1/laporan?tahun=eq.${currentYear}&bulan=eq.${currentMonth}`, {
            method: "DELETE",
            headers: {
              "apikey": config.key,
              "Authorization": `Bearer ${config.key}`
            }
          });

          if (res.ok) {
            showToast("Laporan terhapus dari cloud!");
            loadAndRender();
          } else {
            alert("Gagal menghapus: " + await res.text());
          }
        } catch (e) {
          alert("Kesalahan koneksi: " + e.message);
        }
      }
    }

    // Copy formatted report to clipboard
    async function copyReportText() {
      // Check if data is empty
      let hasData = false;
      for (let sec in data) {
        for (let field in data[sec]) {
          if (data[sec][field]) hasData = true;
        }
      }
      if (!hasData) return;

      const calcGrowthText = (cur, prevVal) => {
        if (!prevVal) return "";
        const c = Number(cur);
        const p = Number(prevVal);
        if (isNaN(c) || isNaN(p)) return "";
        const diff = c - p;
        if (diff > 0) return ` (+${format(diff)})`;
        if (diff < 0) return ` (${format(diff)})`;
        return "";
      };

      const monthNameUpper = monthNames[currentMonth].toUpperCase();
      let t = `📊 *LAPORAN BULANAN LANAUTICA - ${monthNameUpper} ${currentYear}*\n\n`;

      t += `🎥 *LIVE STREAM COUNTS*\n`;
      t += `• Showroom:\n`;
      t += `  - Followers: ${format(data.showroom?.followers)}${calcGrowthText(data.showroom?.followers, prev?.showroom?.followers)}\n`;
      t += `  - Streams: ${data.showroom?.streams || "-"}${calcGrowthText(data.showroom?.streams, prev?.showroom?.streams)}\n`;
      t += `  - Views: ${format(data.showroom?.views)}${calcGrowthText(data.showroom?.views, prev?.showroom?.views)}\n`;
      t += `  - Comments: ${format(data.showroom?.comments)}${calcGrowthText(data.showroom?.comments, prev?.showroom?.comments)}\n`;
      t += `• IDN Live:\n`;
      t += `  - Followers: ${format(data.idn?.followers)}${calcGrowthText(data.idn?.followers, prev?.idn?.followers)}\n`;
      t += `  - Streams: ${data.idn?.streams || "-"}${calcGrowthText(data.idn?.streams, prev?.idn?.streams)}\n`;
      t += `  - Views: ${format(data.idn?.views)}${calcGrowthText(data.idn?.views, prev?.idn?.views)}\n`;
      t += `  - Comments: ${format(data.idn?.comments)}${calcGrowthText(data.idn?.comments, prev?.idn?.comments)}\n\n`;

      t += `📱 *SOCIAL MEDIA COUNTS*\n`;
      t += `• X (Twitter): Followers ${format(data.x?.followers)}${calcGrowthText(data.x?.followers, prev?.x?.followers)} | Posts ${data.x?.posts || "-"}\n`;
      t += `• Threads: Followers ${format(data.threads?.followers)}${calcGrowthText(data.threads?.followers, prev?.threads?.followers)} | Posts ${data.threads?.posts || "-"}\n`;
      t += `• Instagram: Followers ${format(data.instagram?.followers)}${calcGrowthText(data.instagram?.followers, prev?.instagram?.followers)} | Posts ${data.instagram?.posts || "-"} | Stories ${data.instagram?.stories || "-"}\n`;
      t += `• TikTok: Followers ${format(data.tiktok?.followers)}${calcGrowthText(data.tiktok?.followers, prev?.tiktok?.followers)} | Posts ${data.tiktok?.posts || "-"} | Stories ${data.tiktok?.stories || "-"}\n\n`;

      t += `💬 *PM (FANBASE)*\n`;
      t += `• Texts: ${data.pm?.texts || "-"}${calcGrowthText(data.pm?.texts, prev?.pm?.texts)}\n`;
      t += `• Audios: ${data.pm?.audios || "-"}${calcGrowthText(data.pm?.audios, prev?.pm?.audios)}\n`;
      t += `• Images: ${data.pm?.images || "-"}${calcGrowthText(data.pm?.images, prev?.pm?.images)}\n`;

      try {
        await navigator.clipboard.writeText(t);
        showToast("Format salin chat disalin!");
      } catch (err) {
        alert("Gagal menyalin. Silakan copy secara manual.");
      }
    }

    // Export ALL saved reports from Supabase to a single JSON backup file
    async function exportJSON() {
      const config = getSupabaseConfig();
      if (!config.url || !config.key) return;

      try {
        // Fetch all rows
        const res = await fetch(`${config.url}/rest/v1/laporan?select=*`, {
          headers: {
            "apikey": config.key,
            "Authorization": `Bearer ${config.key}`
          }
        });
        
        if (!res.ok) {
          alert("Gagal mengunduh data dari Supabase.");
          return;
        }

        const allData = await res.json();
        
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allData));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `backup_cloud_lanautica_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      } catch (e) {
        alert("Koneksi gagal: " + e.message);
      }
    }

    // Trigger Import file select
    function triggerImport() {
      document.getElementById("jsonUploadInput").click();
    }

    // Import JSON file and restore to Supabase
    async function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const config = getSupabaseConfig();
      if (!config.url || !config.key) {
        alert("Atur Supabase terlebih dahulu!");
        return;
      }

      const pin = prompt("Masukkan PIN Admin untuk memulihkan database cloud:");
      if (pin === null) return;
      if (pin !== config.admin_pin) {
        alert("PIN salah! Aksi ditolak.");
        return;
      }

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) {
            alert("File backup tidak valid! (Harus berupa JSON array hasil ekspor cloud)");
            return;
          }

          if (confirm(`Apakah Anda yakin ingin memulihkan ${imported.length} data laporan ke database cloud?`)) {
            let restoredCount = 0;

            for (let row of imported) {
              if (row.tahun && row.bulan && row.data) {
                const res = await fetch(`${config.url}/rest/v1/laporan`, {
                  method: "POST",
                  headers: {
                    "apikey": config.key,
                    "Authorization": `Bearer ${config.key}`,
                    "Content-Type": "application/json",
                    "Prefer": "on_conflict=tahun,bulan,is_draft,resolution=merge-duplicates"
                  },
                  body: JSON.stringify({
                    tahun: row.tahun,
                    bulan: row.bulan,
                    data: row.data,
                    is_draft: row.is_draft || false,
                    updated_at: row.updated_at || new Date().toISOString()
                  })
                });
                
                if (res.ok) restoredCount++;
              }
            }

            showToast(`${restoredCount} laporan berhasil dipulihkan ke Cloud!`);
            setTimeout(() => window.location.reload(), 1500);
          }
        } catch (err) {
          alert("Gagal membaca file JSON: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    function showToast(msg) {
      const toast = document.getElementById("toastMessage");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2000);
    }
  </script>
