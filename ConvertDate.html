<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Time Converter - Lanautica</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16, #111827, #1e293b);
      --card-bg: rgba(30, 41, 59, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --accent-blue: #38bdf8;
      --accent-blue-hover: #0ea5e9;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-red: #ef4444;
      --accent-red-hover: #dc2626;
      --accent-purple: #a78bfa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', 'Segoe UI', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    .header-nav {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding: 0 10px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s ease;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
    }

    .back-btn:hover {
      color: var(--accent-blue);
      border-color: rgba(56, 189, 248, 0.3);
      background: rgba(56, 189, 248, 0.05);
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wrapper {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 25px;
      z-index: 10;
    }

    @media (max-width: 900px) {
      .wrapper {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
    }

    .pane-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pane-title span.count-badge {
      font-size: 12px;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 10px;
      border-radius: 12px;
      color: var(--text-muted);
    }

    textarea {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    /* CONTROL PANEL */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input[type="text"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: rgba(56, 189, 248, 0.4);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 15px;
    }

    .btn {
      flex: 1;
      min-width: 100px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent-blue);
      color: #090d16;
    }

    .btn-primary:hover {
      background: var(--accent-blue-hover);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .btn-secondary {
      background: var(--accent-green);
      color: white;
    }

    .btn-secondary:hover {
      background: var(--accent-green-hover);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
    }

    .btn-danger {
      background: var(--accent-red);
      color: white;
    }

    .btn-danger:hover {
      background: var(--accent-red-hover);
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }

    /* REAL-TIME PREVIEW LIST */
    .preview-pane {
      margin-top: 25px;
      grid-column: span 2;
    }

    @media (max-width: 900px) {
      .preview-pane {
        grid-column: span 1;
      }
    }

    .preview-table-container {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    th {
      background: rgba(255, 255, 255, 0.02);
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .badge {
      display: inline-flex;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-success {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #10b981;
      color: white;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="header-nav">
    <a href="index.html" class="back-btn">
      ← Hub Utama
    </a>
    <div class="page-title">
      ⏱ Bulk Time Converter
    </div>
    <div style="width: 80px;"></div> <!-- spacer -->
  </div>

  <div class="wrapper">
    <!-- INPUT & OUTPUT PANELS -->
    <div class="card">
      <div class="pane-title">
        <span>Data Input</span>
        <span class="count-badge" id="linesCount">0 Baris</span>
      </div>
      <textarea id="inputData" rows="9" placeholder="Masukkan baris tanggal untuk dikonversi. Contoh:
12.03 AM - 1 Mei 2026
1.05 PM · 14 Mar 2026
7:15 PM - 10 Dec 2026"></textarea>

      <div class="pane-title" style="margin-top: 25px;">
        <span>Hasil Konversi</span>
      </div>
      <textarea id="outputData" rows="9" readonly placeholder="Hasil konversi otomatis muncul di sini..."></textarea>

      <div class="button-row">
        <button class="btn btn-primary" onclick="convertBulk()">⚡ Convert</button>
        <button class="btn btn-secondary" onclick="copyResult()">📋 Copy Hasil</button>
        <button class="btn btn-danger" onclick="clearAll()">🗑 Clear All</button>
      </div>
    </div>

    <!-- CONFIGURATION PANEL -->
    <div class="card">
      <div class="pane-title">Pengaturan</div>
      
      <div class="controls">
        <div class="control-group">
          <label for="formatSelect">Format Output</label>
          <select id="formatSelect" onchange="convertBulk()">
            <option value="custom">M/D/YYYY H:mm:ss (Original)</option>
            <option value="db">YYYY-MM-DD HH:mm:ss</option>
            <option value="euro">DD/MM/YYYY HH:mm</option>
            <option value="iso">ISO 8601 (UTC)</option>
            <option value="unix">Unix Timestamp (detik)</option>
            <option value="custom_tpl">Custom Template</option>
          </select>
        </div>

        <div class="control-group" id="customTemplateGroup" style="display: none;">
          <label for="customTemplate">Template Custom</label>
          <input type="text" id="customTemplate" value="{YYYY}/{MM}/{DD} jam {hh}:{mm}" placeholder="{YYYY}-{MM}-{DD}" oninput="convertBulk()">
          <span style="font-size: 11px; color: var(--text-muted); line-height: 1.4; margin-top: 4px;">
            Gunakan: {YYYY}, {MM}, {DD}, {hh}, {mm}, {ss}
          </span>
        </div>

        <div class="control-group">
          <label for="timezoneSelect">Input Timezone Offset</label>
          <select id="timezoneSelect" onchange="convertBulk()">
            <option value="local">Waktu Lokal Browser</option>
            <option value="+0700" selected>GMT+07:00 (WIB)</option>
            <option value="+0800">GMT+08:00 (WITA)</option>
            <option value="+0900">GMT+09:00 (WIT)</option>
            <option value="+0000">GMT+00:00 (UTC)</option>
            <option value="-0500">GMT-05:00 (EST)</option>
          </select>
        </div>

        <div class="control-group">
          <label>Contoh Cepat</label>
          <button class="btn" style="background: rgba(255,255,255,0.05); color: var(--text-main); font-size: 12px; padding: 8px;" onclick="loadSample()">
            💡 Load Data Contoh
          </button>
        </div>
      </div>
    </div>

    <!-- PREVIEW TABLE -->
    <div class="card preview-pane">
      <div class="pane-title">Analisis Detil & Status</div>
      <div class="preview-table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 5%">Line</th>
              <th style="width: 40%">Input Asli</th>
              <th style="width: 15%">Status</th>
              <th style="width: 40%">Hasil Terformat</th>
            </tr>
          </thead>
          <tbody id="analysisBody">
            <tr>
              <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 30px;">
                Belum ada data. Silakan ketik atau tempel data di atas.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMessage">Hasil disalin ke clipboard!</div>

  <script>
    const monthMap = {
      jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5,
      jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11,
      januari: 0, februari: 1, maret: 2, april: 3, mei: 4, juni: 5,
      juli: 6, agustus: 7, september: 8, oktober: 9, november: 10, desember: 11
    };

    // Auto convert on typing
    document.getElementById("inputData").addEventListener("input", function() {
      const lines = this.value.split("\n");
      const count = this.value.trim() ? lines.length : 0;
      document.getElementById("linesCount").textContent = `${count} Baris`;
      convertBulk();
    });

    function loadSample() {
      const sample = `12.03 AM - 1 Mei 2026
1.05 PM · 14 Mar 2026
07:15 PM - 10 Desember 2026
10.22 AM · 8 Aug 2026
invalid line here`;
      document.getElementById("inputData").value = sample;
      document.getElementById("linesCount").textContent = "5 Baris";
      convertBulk();
    }

    function formatCustom(date, formatType) {
      if (isNaN(date)) return "Invalid Date";

      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const hours = date.getHours();
      const minutes = date.getMinutes();
      const seconds = date.getSeconds();

      const pad = (n) => String(n).padStart(2, '0');

      switch (formatType) {
        case "db":
          return `${year}-${pad(month)}-${pad(day)} ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        case "euro":
          return `${pad(day)}/${pad(month)}/${year} ${pad(hours)}:${pad(minutes)}`;
        case "iso":
          return date.toISOString();
        case "unix":
          return Math.floor(date.getTime() / 1000);
        case "custom_tpl":
          const tpl = document.getElementById("customTemplate").value;
          return tpl
            .replace(/{YYYY}/g, year)
            .replace(/{MM}/g, pad(month))
            .replace(/{DD}/g, pad(day))
            .replace(/{hh}/g, pad(hours))
            .replace(/{mm}/g, pad(minutes))
            .replace(/{ss}/g, pad(seconds));
        case "custom":
        default:
          return `${month}/${day}/${year} ${hours}:${pad(minutes)}:${pad(seconds)}`;
      }
    }

    function convertLine(input, tzOffset) {
      try {
        if (!input) return { success: false, value: "" };

        // Support multiple delimiters: ·, -, @, at
        const parts = input.split(/·|-|@|at/i);
        if (parts.length !== 2) return { success: false, error: "Delimiter separator tidak ditemukan" };

        const timePart = parts[0].trim();
        const datePart = parts[1].trim();

        // Support : or . in time
        let [time, modifier] = timePart.replace(":", ".").split(" ");
        if (!time || !modifier) return { success: false, error: "Format modifier AM/PM salah" };

        let [hoursStr, minutesStr] = time.split(".");
        let hours = parseInt(hoursStr);
        let minutes = parseInt(minutesStr);

        if (isNaN(hours) || isNaN(minutes)) return { success: false, error: "Waktu jam/menit tidak valid" };

        if (modifier.toUpperCase() === "PM" && hours !== 12) hours += 12;
        if (modifier.toUpperCase() === "AM" && hours === 12) hours = 0;

        const dateParts = datePart.split(/\s+/);
        if (dateParts.length !== 3) return { success: false, error: "Format tanggal salah (butuh Hari Bulan Tahun)" };

        const day = parseInt(dateParts[0]);
        const monthStr = dateParts[1].toLowerCase();
        const year = parseInt(dateParts[2]);

        const month = monthMap[monthStr];

        if (isNaN(day) || month === undefined || isNaN(year)) {
          return { success: false, error: "Hari, bulan, atau tahun tidak valid" };
        }

        let date;
        if (tzOffset === "local") {
          date = new Date(year, month, day, hours, minutes, 0);
        } else {
          // Parse as dynamic timezone offset (e.g. GMT+0700)
          const isoString = `${year}-${String(month+1).padStart(2, '0')}-${String(day).padStart(2, '0')}T${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:00${tzOffset}`;
          date = new Date(isoString);
        }

        if (isNaN(date.getTime())) {
          return { success: false, error: "Hasil tanggal tidak valid" };
        }

        return { success: true, value: date };

      } catch (e) {
        return { success: false, error: e.message || "Gagal melakukan parse" };
      }
    }

    function convertBulk() {
      const input = document.getElementById("inputData").value;
      const lines = input.split("\n");
      const formatType = document.getElementById("formatSelect").value;
      const tzOffset = document.getElementById("timezoneSelect").value;

      // Show/Hide Custom Template input
      const customTplGroup = document.getElementById("customTemplateGroup");
      if (formatType === "custom_tpl") {
        customTplGroup.style.display = "flex";
      } else {
        customTplGroup.style.display = "none";
      }

      if (input.trim() === "") {
        document.getElementById("outputData").value = "";
        document.getElementById("analysisBody").innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 30px;">
              Belum ada data. Silakan ketik atau tempel data di atas.
            </td>
          </tr>`;
        return;
      }

      let results = [];
      let analysisHtml = "";

      lines.forEach((line, index) => {
        const trimmed = line.trim();
        if (trimmed === "") {
          results.push("");
          return;
        }

        const parseResult = convertLine(trimmed, tzOffset);
        
        if (parseResult.success) {
          const formatted = formatCustom(parseResult.value, formatType);
          results.push(formatted);

          analysisHtml += `
            <tr>
              <td class="mono" style="color: var(--text-muted)">${index + 1}</td>
              <td class="mono">${escapeHtml(trimmed)}</td>
              <td><span class="badge badge-success">SUKSES</span></td>
              <td class="mono" style="color: var(--accent-blue)">${escapeHtml(String(formatted))}</td>
            </tr>`;
        } else {
          results.push(`Error: ${parseResult.error} [${trimmed}]`);

          analysisHtml += `
            <tr>
              <td class="mono" style="color: var(--text-muted)">${index + 1}</td>
              <td class="mono" style="color: rgba(255,255,255,0.4)">${escapeHtml(trimmed)}</td>
              <td><span class="badge badge-error">GAGAL</span></td>
              <td style="color: var(--accent-red); font-size: 12px;">${parseResult.error}</td>
            </tr>`;
        }
      });

      document.getElementById("outputData").value = results.join("\n");
      document.getElementById("analysisBody").innerHTML = analysisHtml;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function copyResult() {
      const output = document.getElementById("outputData").value;
      if (!output) return;
      
      try {
        await navigator.clipboard.writeText(output);
        showToast();
      } catch (err) {
        // Fallback copy
        const textarea = document.getElementById("outputData");
        textarea.select();
        document.execCommand("copy");
        showToast();
      }
    }

    function showToast() {
      const toast = document.getElementById("toastMessage");
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2000);
    }

    function clearAll() {
      document.getElementById("inputData").value = "";
      document.getElementById("outputData").value = "";
      document.getElementById("linesCount").textContent = "0 Baris";
      convertBulk();
    }
  </script>

</body>
</html>
